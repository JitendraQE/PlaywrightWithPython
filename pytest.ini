[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = resources/Logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
reporting_labs_output = resources/reporting-labs
markers =
    smoke: critical business functionality
    regression: broader functional coverage
    negative: invalid input and error handling
    validation: client/server-side form validation
    auth: authentication and session scenarios
